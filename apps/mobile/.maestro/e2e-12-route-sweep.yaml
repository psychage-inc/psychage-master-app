# E2E-12 — Manual-sweep automation (2026-08-29). Opens every route NOT covered by
# e2e-01…11 by deep link, screenshots it, records if the root ErrorBoundary ("Try again")
# appeared, then relaunches (iOS has no system back; several of these screens have no back
# affordance of their own). Runs the whole list in LIGHT mode, flips Appearance → Night, and
# runs it again for DARK-mode parity. No assertions — this is evidence collection for the
# visual sweep in the report; look at the PNGs.
appId: com.psychage.app
---
- runFlow: _boot.yaml
- extendedWaitUntil:
    visible: '(Help now|Explore without an account)'
    timeout: 30000
- takeScreenshot: e2e-12/light-00-home
- openLink: psychage://insights
- waitForAnimationToEnd
- takeScreenshot: e2e-12/light-01-insights
- runFlow:
    when:
      visible: 'Try again'
