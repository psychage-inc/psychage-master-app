# Rail bounds on iPhone 17 Pro (402x874pt): x 81..321pt, y ~560pt before selection.
# Before any scroll the rail sits at ~70% and is CLIPPED (only the knob's top edge
# shows), so first scroll the sheet body to bring the rail up to ~64%.
- swipe:
    start: '50%,50%'
    end: '50%,30%'
    duration: 500
- tapOn:
    point: '56%,64%'
- extendedWaitUntil:
    visible: 'Neutral'
    timeout: 5000
# The sheet's ScrollView is shorter than its content: the word chips render clipped
# under the fold, so scroll the sheet body to reveal them before tapping.
- swipe:
    start: '50%,45%'
    end: '50%,20%'
    duration: 500
- tapOn: ${LABEL_ON}
- takeScreenshot: e2e-05/06-capture-with-consent-on
- tapOn: 'Save this moment'
- extendedWaitUntil:
    notVisible: 'Save this moment'
    timeout: 5000
# (runner: REST check that a moments row with label LABEL_ON exists for this user)

# Consent OFF.
- tapOn: 'Account'
- extendedWaitUntil:
    visible: 'Accessibility & appearance'
    timeout: 5000
- scrollUntilVisible:
    element:
      text: 'Privacy & your data'
    direction: DOWN
    timeout: 10000
- tapOn: 'Privacy & your data'
- extendedWaitUntil:
    visible: 'Back up check-ins to your account'
    timeout: 5000
- tapOn:
    id: 'sync-consent-toggle'
- takeScreenshot: e2e-05/07-privacy-consent-off-again
- runFlow: _boot.yaml
