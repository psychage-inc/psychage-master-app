# under the fold, so scroll the sheet body to reveal them before tapping.
- swipe:
    start: '50%,45%'
    end: '50%,20%'
    duration: 500
- tapOn: ${LABEL_OFF}
- takeScreenshot: e2e-05/08-capture-with-consent-off
- tapOn: 'Save this moment'
- extendedWaitUntil:
    notVisible: 'Save this moment'
    timeout: 5000
# (runner: REST check that NO moments row with label LABEL_OFF exists — SR-4)
- tapOn: 'Today'
- tapOn: 'History'
- extendedWaitUntil:
    visible: 'Your moments'
    timeout: 5000
- takeScreenshot: e2e-05/09-history-final
- runFlow: _boot.yaml
