# E2E-01 — First run + onboarding (2026-08-29 live-backend verification).
# Fresh state → front-door Welcome (S0) → onboarding Welcome (S1) → Interests (P18,
# taxonomy must come from Supabase article_categories, not a fixture) → home → first
# Moment capture from home (onboarding no longer captures a Moment itself — the
# interests screen is the onboarding terminal, see app/onboarding/interests.tsx).
#
# SR-2 evidence: every screen before home is screenshotted so the presence/absence of
# the "Help now" affordance is on record. The front-door S0 screen uses ScreenShell,
# not GlobalHeader — the 01-welcome screenshot documents whether crisis is reachable.
#
# Run from the evidence dir so screenshots land there:
#   cd ~/dev/psychage-e2e-evidence/<date> && maestro test <repo>/apps/mobile/.maestro/e2e-01-first-run-onboarding.yaml
appId: com.psychage.app
---
- runFlow: _boot-fresh.yaml
- extendedWaitUntil:
    visible: 'Explore without an account'
    timeout: 30000
- takeScreenshot: e2e-01/01-front-door-welcome
- assertVisible: 'Create an account'
- assertVisible: 'Log in'
# SR-2: record whether the crisis pill exists on the front door (expected: absent).
- assertNotVisible: 'Help now'

# Anonymous-first path.
- tapOn: 'Explore without an account'
- extendedWaitUntil:
    visible: 'Welcome to Psychage.'
    timeout: 10000
- assertVisible: 'Help now'
- takeScreenshot: e2e-01/02-onboarding-welcome
- tapOn: 'Get started'

# Interests — chips are DB-populated (interest-chip-<slug>); wait for the query.
- extendedWaitUntil:
    visible: 'What would you like to explore?'
    timeout: 10000
- assertVisible: 'Help now'
- extendedWaitUntil:
    visible:
      id: 'interest-chip-.*'
    timeout: 20000
- takeScreenshot: e2e-01/03-interests-loaded
- tapOn:
    id: 'interest-chip-.*'
    index: 0
- tapOn:
    id: 'interest-chip-.*'
    index: 1
- takeScreenshot: e2e-01/04-interests-selected
- tapOn: 'Continue'

# Home (first run) — the cross-tab tour (native Modal) overlays home. SR-2 evidence:
# while the tour is up NOTHING behind it is reachable, including the Help-now pill, so
# crisis from the first home is 2 taps (Skip → Help now), not 1.
- extendedWaitUntil:
    visible: 'Skip the tour'
    timeout: 15000
- takeScreenshot: e2e-01/05-home-first-run-tour
- assertNotVisible: 'Help now'
- tapOn: 'Skip the tour'
- extendedWaitUntil:
    visible: 'Help now'
    timeout: 10000
- takeScreenshot: e2e-01/06-home

# First Moment capture from home.
- tapOn: '(Check in — 30 seconds|Update today.s check-in)'
- extendedWaitUntil:
    visible: 'How are you right now?'
    timeout: 5000
- assertVisible: 'Help now'
- takeScreenshot: e2e-01/07-capture-sheet
# The feeling control is a scrub shape; tapping its centre commits valence 3.
# Feeling control. The Skia shape ignores touch on this build and a touch that STARTS
# on the rail knob resolves knob-relative (always "Very unpleasant"), so tap the rail
# TRACK to the right of the resting knob instead — that commits valence 3 ("Neutral").
# Rail bounds on iPhone 17 Pro (402x874pt): x 81..321pt, y ~560pt before selection.
# Before any scroll the rail sits at ~70% and is CLIPPED (only the knob's top edge
# shows), so first scroll the sheet body to bring the rail up to ~64%.
- swipe:
    start: '50%,50%'
    end: '50%,30%'
    duration: 500
- tapOn:
    point: '56%,64%'
- extendedWaitUntil:
    visible: 'Neutral'
    timeout: 5000
# The sheet's ScrollView is shorter than its content: the word chips render clipped
# under the fold, so scroll the sheet body to reveal them before tapping.
- swipe:
    start: '50%,45%'
    end: '50%,20%'
    duration: 500
- tapOn: 'Steady'
- takeScreenshot: e2e-01/08-capture-filled
- tapOn: 'Save this moment'
- extendedWaitUntil:
    notVisible: 'Save this moment'
    timeout: 5000
- takeScreenshot: e2e-01/09-home-after-first-moment
